name: ci

# Test suite on every push and PR. The production image is built and pushed
# to GHCR by `image.yml` on a version tag; here we only *build* it (no push)
# so a broken Dockerfile fails the PR instead of the release.
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"
      - run: pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
