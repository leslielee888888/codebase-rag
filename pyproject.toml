[project]
name = "codebase-rag"
version = "0.1.0"
description = "Cross-repo codebase RAG assistant: index multiple codebases, ask grounded, cited questions across all of them."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "claude-agent-sdk>=0.2",
    "ollama>=0.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
codebase-rag = "codebase_rag.cli:app"
codebase-rag-api = "codebase_rag.api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
